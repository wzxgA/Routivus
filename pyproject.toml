[project]
name = "xg-cli"
version = "1.1.2"
description = "XG-CLI: a commercial-grade Python Agent CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "textual>=0.70.0",
    # SmartRouter ML 精判（原 ml extras 并入核心）：TF-IDF + LightGBM 离线训练与精判
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
    # SmartRouter 语义精判（运行时推理两件；torch 等导出大件仍为可选语义 extras）
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
# SmartRouter 语义导出（仅 tools/export_bge_onnx.py 离线重导出模型时需要，通常无需安装）
semantic = [
    "optimum[onnxruntime]>=1.16",
    "transformers>=4.40",
    "torch>=2.2",
    "safetensors>=0.4",
]

[project.scripts]
xg-cli = "xg.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["xg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests, run with `uv run pytest -m slow`",
]
