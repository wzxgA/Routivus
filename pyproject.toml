[project]
name = "routivus"
version = "0.1.0"
description = "Routivus: smart-routing multi-agent backend (port of Routivus-CLI core)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # SmartRouter ML 精判（原 ml extras 并入核心）：TF-IDF + LightGBM 离线训练与精判
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
    # SmartRouter 语义精判（运行时推理两件；torch 等导出大件仍为可选语义 extras）
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    # Web Console 终端的 ConPTY 后端（仅 Windows 有意义）。放在核心依赖里：
    # 缺了它终端通道会明确报错（terminal_unavailable），"装完就能用终端"这一步
    # 不该再让用户自己去找一个 extra（方案 09 §0.4）。
    "pywinpty>=2.0; sys_platform == 'win32'",
    # WebSocket 实现。uvicorn 只声明 http 栈，WS 协议要另装实现（websockets / wsproto）——
    # 缺了它每个升级请求都被拒（日志：Unsupported upgrade request / No supported
    # WebSocket library detected），前端表现是永远"重连中"，整条对话通道不可用。
    # 之所以显式列出而不是写 uvicorn[standard]：standard 还会带上 httptools /
    # watchfiles / uvloop 等本项目用不到的加速件，装完即可用只需要这一个。
    "websockets>=17.1",
]

[project.optional-dependencies]
# SmartRouter 语义导出（仅 tools/export_bge_onnx.py 离线重导出模型时需要，通常无需安装）
semantic = [
    "optimum[onnxruntime]>=1.16",
    "transformers>=4.40",
    "torch>=2.2",
    "safetensors>=0.4",
]
# 历史 extra：pywinpty 已并入核心依赖（见上）。保留名字是为了让 README / 脚本里
# 既有的 `pip install "routivus[terminal]"` 不报「未知 extra」。
terminal = []

# 桌面客户端前端由 Routivus 客户端另行接入，暂不提供 CLI 脚本入口
[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["routivus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests, run with `uv run pytest -m slow`",
]
