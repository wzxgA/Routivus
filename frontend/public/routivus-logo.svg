<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 暖白色渐变背景 -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FDF8F2"/>
      <stop offset="100%" stop-color="#F5EDE3"/>
    </radialGradient>
    <!-- 主色渐变：暖橙 -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#D4845A"/>
    </linearGradient>
    <!-- 线条用渐变（userSpaceOnUse：水平线不会被算成零面积而失渲染） -->
    <linearGradient id="warmLineGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="400">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#D4845A"/>
    </linearGradient>
    <!-- 辅色渐变：暖金 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C987"/>
      <stop offset="100%" stop-color="#D4A855"/>
    </linearGradient>
    <!-- 节点发光效果（userSpaceOnUse 固定区域：水平线的零高度包围盒不会把滤镜区域裁成零） -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="180" y="140" width="200" height="60">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#C4A882" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景圆角方形 -->
  <rect x="20" y="20" width="360" height="360" rx="72" ry="72" fill="url(#bgGrad)" stroke="#E8D8C4" stroke-width="1.5"/>
  <!-- 内层柔和边框 -->
  <rect x="36" y="36" width="328" height="328" rx="60" ry="60" fill="none" stroke="#EAD9C8" stroke-width="0.8" opacity="0.6"/>
  <!-- ===== 核心图形：智能路由网络（放大外扩版，无文字，垂直居中） ===== -->
  <g transform="translate(0 32)">
  <!-- 左侧到中心的连接路径（灰色，未选中） -->
  <line x1="101" y1="90" x2="180" y2="152" stroke="#D4C4B0" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="74" y1="168" x2="174" y2="168" stroke="#D4C4B0" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="101" y1="247" x2="180" y2="184" stroke="#D4C4B0" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <!-- 左侧候选节点（3个备选） -->
  <circle cx="88" cy="80" r="14" fill="#F0C987" opacity="0.85" filter="url(#softShadow)"/>
  <circle cx="88" cy="80" r="14" fill="none" stroke="#FFF5EB" stroke-width="1" opacity="0.6"/>
  <circle cx="88" cy="80" r="5" fill="#FFF5EB" opacity="0.8"/>
  <circle cx="58" cy="168" r="14" fill="#F0C987" opacity="0.85" filter="url(#softShadow)"/>
  <circle cx="58" cy="168" r="14" fill="none" stroke="#FFF5EB" stroke-width="1" opacity="0.6"/>
  <circle cx="58" cy="168" r="5" fill="#FFF5EB" opacity="0.8"/>
  <circle cx="88" cy="257" r="14" fill="#F0C987" opacity="0.85" filter="url(#softShadow)"/>
  <circle cx="88" cy="257" r="14" fill="none" stroke="#FFF5EB" stroke-width="1" opacity="0.6"/>
  <circle cx="88" cy="257" r="5" fill="#FFF5EB" opacity="0.8"/>
  <!-- 中心节点（Agent 工作站核心） -->
  <circle cx="200" cy="168" r="24" fill="url(#warmGrad)" filter="url(#softShadow)"/>
  <circle cx="200" cy="168" r="24" fill="none" stroke="#FFF5EB" stroke-width="1.5" opacity="0.5"/>
  <!-- 中心节点内部小点 -->
  <circle cx="200" cy="168" r="7" fill="#FFF5EB" opacity="0.9"/>
  <circle cx="200" cy="168" r="3" fill="#E8A87C" opacity="0.6"/>
  <!-- 中心到右侧输出（高亮路径 — 选中，两端接入节点） -->
  <line x1="224" y1="168" x2="318" y2="168" stroke="url(#warmLineGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- 路径上的流动光点 -->
  <circle cx="258" cy="168" r="3.5" fill="#FFF5EB" opacity="0.95">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="286" cy="168" r="2.5" fill="#FFF5EB" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <!-- 右侧输出节点（选中，加大） -->
  <circle cx="336" cy="168" r="18" fill="url(#goldGrad)" filter="url(#softShadow)"/>
  <circle cx="336" cy="168" r="18" fill="none" stroke="#FFF5EB" stroke-width="1.2" opacity="0.6"/>
  <circle cx="336" cy="168" r="6" fill="#FFF5EB" opacity="0.9"/>
  <!-- 选中节点脉冲环（强化"最优"，无对勾） -->
  <circle cx="336" cy="168" r="18" fill="none" stroke="#D4845A" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="18;26" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  </g>
</svg>
